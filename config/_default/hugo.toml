baseURL = "https://farsalinos.github.io/"
locale = "en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
buildDrafts = false
enableEmoji = true
pagination.pagerSize = 10

[outputs]
  home = ["html", "json"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

[outputFormats.json]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  noUgly = true
  notAlternative = true

[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v3"