{{- /* Donation banner: PayPal button + short message, visible on all pages, bilingual */ -}}
<div class="donate-banner flex flex-col sm:flex-row items-center justify-between gap-3 px-4 py-3 rounded-lg border border-neutral-200 dark:border-neutral-700 bg-neutral-100 dark:bg-neutral-800/60">
  <p class="donate-banner-message text-sm text-neutral-700 dark:text-neutral-300 m-0">
    {{ i18n "donate_message" }}
  </p>
  <form action="https://www.paypal.com/donate" method="post" target="_top" class="shrink-0">
    <input type="hidden" name="hosted_button_id" value="MLZSK23VJHLXU" />
    <input type="image"
           src="https://www.paypalobjects.com/en_US/i/btn/btn_donate_LG.gif"
           border="0" name="submit"
           title="PayPal - The safer, easier way to pay online!"
           alt="Donate with PayPal button" />
    <img alt="" border="0" src="https://www.paypalobjects.com/en_US/i/scr/pixel.gif" width="1" height="1" />
  </form>
</div>
